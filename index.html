<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SOS חירום עם זיהוי פנים וקוד</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.8/dist/face-api.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #fff0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            position: relative;
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .settings-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #666;
        }
        h1 { color: #d9534f; font-size: 26px; margin-top: 0; }
        p { color: #333; font-size: 15px; margin: 15px 0; }
        
        #videoContainer {
            position: relative;
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #faceStatus {
            position: absolute;
            bottom: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 8px;
        }

        .locked-content {
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .unlocked-content {
            opacity: 1;
            pointer-events: auto;
        }

        #msg { margin-top: 10px; font-size: 14px; font-weight: bold; color: #555; }
        
        a.wa-link { 
            display: none; 
            background: #25d366; 
            color: white; 
            padding: 16px; 
            margin-top: 15px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 16px; 
            box-sizing: border-box; 
            width: 100%; 
            box-shadow: 0 4px 8px rgba(37,211,102,0.3);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 340px;
            text-align: right;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .modal-content label { font-size: 13px; font-weight: bold; display: block; margin-top: 12px; color: #333; }
        .modal-content input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .modal-btn { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .secondary-btn { background: #6c757d; }
        
        #pinUnlockBox {
            margin-bottom: 15px;
            display: none;
        }
        #pinInput, #settingsPassInput {
            text-align: center;
            letter-spacing: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="box">
    <button class="settings-btn" onclick="requestSettingsAccess()">⚙️</button>
    
    <h1>מוקד חירום</h1>
    
    <div id="pinUnlockBox">
        <p style="margin:5px 0; font-size:13px;">או הזן קוד גישה סודי:</p>
        <div style="display: flex; gap: 5px;">
            <input type="password" id="pinInput" placeholder="****" maxlength="6">
            <button onclick="checkPin()" style="width: auto; padding: 0 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">אישור</button>
        </div>
    </div>

    <div id="videoContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="faceStatus">טוען מערכת אבטחה...</div>
    </div>

    <div id="emergencyControls" class="locked-content">
        <p>אימות עבר בהצלחה. מאתר מיקום...</p>
        <div id="msg"></div>
        
        <a id="waBtn" class="wa-link" href="#" target="_blank">שלח לאיש קשר 🚀</a>
    </div>
</div>

<!-- חלון בקשת סיסמה לכניסה להגדרות -->
<div id="settingsAuthModal" class="modal-overlay">
    <div class="modal-content" style="text-align: center;">
        <h3>בקרת גישה להגדרות</h3>
        <p style="font-size: 13px; color: #666;">הזן קוד גישה להגדרות:</p>
        <input type="password" id="settingsPassInput" placeholder="****" maxlength="6">
        <button type="button" class="modal-btn" onclick="verifySettingsPassword()">הכנס להגדרות</button>
        <button type="button" class="modal-btn secondary-btn" style="margin-top: 8px;" onclick="closeSettingsAuth()">ביטול</button>
    </div>
</div>

<!-- חלון הגדרות ראשי -->
<div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
        <h3>הגדרות מערכת</h3>
        
        <label>מספר טלפון לוואטסאפ (לדוגמה: 972524905732):</label>
        <input type="text" id="phoneInput" placeholder="972XXXXXXXXX">

        <label>קוד גישה להגדרות (ולהפעלה מהירה):</label>
        <input type="password" id="secretPinInput" placeholder="הכנס קוד סודי">

        <label>עדכון זיהוי פנים אישי:</label>
        <p style="font-size:12px; color:#666; margin:2px 0 8px 0;">הסתכל למצלמה ולחץ על הכפתור כדי לשמור את הפנים שלך במכשיר.</p>
        <div style="position:relative; width:100%; height:120px; background:#000; border-radius:8px; overflow:hidden; margin-bottom:10px;">
            <video id="settingsWebcam" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; transform:scaleX(-1);"></video>
        </div>
        <button type="button" class="modal-btn secondary-btn" onclick="captureUserFace()">צלם ושמור את הפנים שלי 📸</button>
        <div id="faceRegStatus" style="font-size:12px; margin-top:5px; font-weight:bold; color:#007bff;"></div>

        <button type="button" class="modal-btn" onclick="saveSettings()" style="margin-top:20px;">שמור הכל ויציאה</button>
        <button type="button" class="modal-btn" style="background:#dc3545; margin-top:8px;" onclick="closeSettings()">סגור</button>
    </div>
</div>

<script>
// טעינת הנתונים מזיכרון המכשיר בצורה בטוחה
let targetPhone = localStorage.getItem('sos_phone') || '972524905732';
let savedPin = localStorage.getItem('sos_pin') || '1234';
let savedFaceDescriptor = localStorage.getItem('sos_face') ? new Float32Array(JSON.parse(localStorage.getItem('sos_face'))) : null;

document.getElementById('phoneInput').value = targetPhone;
document.getElementById('secretPinInput').value = savedPin;

if (savedPin) {
    document.getElementById('pinUnlockBox').style.display = 'block';
}

function requestSettingsAccess() {
    document.getElementById('settingsAuthModal').style.display = 'flex';
    document.getElementById('settingsPassInput').value = '';
}

function closeSettingsAuth() {
    document.getElementById('settingsAuthModal').style.display = 'none';
}

function verifySettingsPassword() {
    const enteredPass = document.getElementById('settingsPassInput').value.trim();
    if (enteredPass === savedPin) {
        closeSettingsAuth();
        openSettings();
    } else {
        alert('קוד גישה שגוי להגדרות!');
    }
}

function openSettings() {
    document.getElementById('settingsModal').style.display = 'flex';
    startSettingsCamera();
}

function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
    stopSettingsCamera();
}

let settingsStream = null;
async function startSettingsCamera() {
    try {
        const videoEl = document.getElementById('settingsWebcam');
        settingsStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        videoEl.srcObject = settingsStream;
    } catch(e) {
        console.error(e);
    }
}

function stopSettingsCamera() {
    if (settingsStream) {
        settingsStream.getTracks().forEach(t => t.stop());
    }
}

async function captureUserFace() {
    const statusEl = document.getElementById('faceRegStatus');
    statusEl.innerText = "מזהה פנים במצלמה...";
    
    const videoEl = document.getElementById('settingsWebcam');
    const detection = await faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
    
    if (detection) {
        const descriptorArray = Array.from(detection.descriptor);
        localStorage.setItem('sos_face', JSON.stringify(descriptorArray));
        savedFaceDescriptor = detection.descriptor;
        statusEl.style.color = "green";
        statusEl.innerText = "הפנים נשמרו בהצלחה במכשיר! ✓";
    } else {
        statusEl.style.color = "red";
        statusEl.innerText = "לא זוהו פנים ברורות, נסה שוב מול אור.";
    }
}

function saveSettings() {
    const inputVal = document.getElementById('phoneInput').value.trim();
    const pinVal = document.getElementById('secretPinInput').value.trim();
    
    if (inputVal) {
        targetPhone = inputVal;
        localStorage.setItem('sos_phone', targetPhone);
    }
    
    if (pinVal) {
        savedPin = pinVal;
        localStorage.setItem('sos_pin', savedPin);
    }
    
    // וידוא שמירה פיזית בזיכרון הדפדפן
    localStorage.setItem('sos_phone', targetPhone);
    localStorage.setItem('sos_pin', savedPin);

    alert('ההגדרות נשמרו בהצלחה לתמיד!');
    closeSettings();
    location.reload();
}

function checkPin() {
    const enteredPin = document.getElementById('pinInput').value.trim();
    if (enteredPin === savedPin) {
        unlockApp("קוד גישה אושר ✓");
    } else {
        alert('קוד שגוי!');
    }
}

function unlockApp(msgText) {
    const faceStatus = document.getElementById('faceStatus');
    const controls = document.getElementById('emergencyControls');
    
    faceStatus.style.background = "rgba(40, 167, 69, 0.8)";
    faceStatus.innerText = msgText;
    
    controls.classList.remove('locked-content');
    controls.classList.add('unlocked-content');
    
    const video = document.getElementById('webcam');
    if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
    }
    setTimeout(() => {
        document.getElementById('videoContainer').style.display = 'none';
        document.getElementById('pinUnlockBox').style.display = 'none';
    }, 1000);

    autoGetLocation();
}

const video = document.getElementById('webcam');
const faceStatus = document.getElementById('faceStatus');
const controls = document.getElementById('emergencyControls');

async function initFaceDetection() {
    try {
        faceStatus.innerText = "טוען רכיבי אבטחה...";
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.8/model';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        
        faceStatus.innerText = "מפעיל מצלמה...";
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;

        video.onplay = () => {
            faceStatus.innerText = "סורק פנים...";
            
            const interval = setInterval(async () => {
                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                
                if (detection) {
                    if (savedFaceDescriptor) {
                        const distance = faceapi.euclideanDistance(detection.descriptor, savedFaceDescriptor);
                        if (distance < 0.5) {
                            clearInterval(interval);
                            unlockApp("זיהוי פנים עבר בהצלחה ✓");
                        }
                    } else {
                        clearInterval(interval);
                        unlockApp("זיהוי פנים עבר בהצלחה ✓");
                    }
                }
            }, 800);
        };
    } catch (err) {
        console.error(err);
        faceStatus.style.background = "rgba(217, 83, 79, 0.8)";
        faceStatus.innerText = "שגיאה בהפעלת מצלמה / זיהוי";
    }
}

window.addEventListener('DOMContentLoaded', initFaceDetection);

function autoGetLocation() {
    const m = document.getElementById("msg");
    const waBtn = document.getElementById("waBtn");
    
    if (!navigator.geolocation) {
        m.innerText = "המכשיר לא תומך באיתור מיקום.";
        return;
    }
    m.innerText = "מאיתר מיקום מדויק...";

    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const url = `https://www.google.com/maps?q=${lat},${lon}`;
            const text = encodeURIComponent(`🚨 SOS! צריך עזרה דחופה. המיקום שלי:\n${url}`);
            
            m.innerText = "המיקום נמצא בהצלחה!";
            waBtn.href = `https://wa.me/${targetPhone}?text=${text}`;
            waBtn.innerText = `שלח לאיש קשר (${targetPhone}) 🚀`;
            waBtn.style.display = "block";
        },
        error => {
            m.innerText = "שגיאה: וודא שהרשאת מיקום פתוחה בדפדפן.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
} 
</script> 

</body>
</html>
