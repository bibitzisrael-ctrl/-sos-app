<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מוקד חירום - SOS</title>
    <!-- טעינת ספריית זיהוי הפנים -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff0f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }
        .settings-icon {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
        }
        h2 {
            color: #d9534f;
            margin-bottom: 10px;
        }
        #videoContainer {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #statusMessage {
            margin-top: 15px;
            font-size: 16px;
            color: #333;
        }
        .whatsapp-btn {
            display: none; /* מוסתר כברירת מחדל עד לאימות מלא */
            margin-top: 15px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- כפתור הגדרות -->
        <button class="settings-icon" onclick="openSettings()">⚙️</button>

        <h2>מוקד חירום</h2>
        <p>או הזן קוד גישה סודי:</p>

        <!-- אזור הזנת קוד סודי וכפתור אישור מתחתיו -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; margin-top: 15px;">
            <input type="password" id="pinInput" placeholder="****" maxlength="4" style="text-align: center; font-size: 20px; padding: 8px; width: 80%; border: 1px solid #ccc; border-radius: 8px;">
            <button id="pinSubmitBtn" onclick="checkPin()" style="background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 80%;">אישור</button>
        </div>

        <!-- מצלמה וזיהוי פנים -->
        <div id="videoContainer">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <div id="statusMessage">טוען מערכת זיהוי פנים...</div>
        
        <!-- כפתור שליחת וואטסאפ חירום (מוסתר עד לאימות) -->
        <a id="waBtn" class="whatsapp-btn" href="#" target="_blank">שלח לאיש קשר SOS</a>
    </div>

    <script>
        const targetPhone = localStorage.getItem('sos_phone') || "972000000000";
        const correctPin = localStorage.getItem('sos_pin') || "1234";
        
        let globalLocationUrl = ""; // נשמור את המיקום בצד עד לאיتمام האימות

        function openSettings() {
            const pin = prompt("הכנס קוד סודי לכניסה להגדרות:");
            if (pin === correctPin) {
                const newPhone = prompt("הכנס מספר טלפון חדש לוואטסאפ (לדוגמה 9725...):", targetPhone);
                if (newPhone) {
                    localStorage.setItem('sos_phone', newPhone);
                    alert("המספר עודכן בהצלחה!");
                    location.reload();
                }
            } else if (pin !== null) {
                alert("קוד שגוי!");
            }
        }

        // פונקציית אימות הקוד הסודי - מאשרת גישה ישירה
        function checkPin() {
            const enteredPin = document.getElementById('pinInput').value;
            if (enteredPin === correctPin) {
                alert("קוד נכון! אימות הצליח.");
                unlockApp();
            } else {
                alert("קוד סודי שגוי.");
            }
        }

        // פונקציה שחושפת את כפתור השליחה לוואטסאפ לאחר אימות מוצלח
        function unlockApp() {
            const waBtn = document.getElementById('waBtn');
            if (globalLocationUrl) {
                waBtn.href = globalLocationUrl;
                waBtn.style.display = "block";
                document.getElementById('statusMessage').innerText = "אימות עבר בהצלחה. ניתן לשלוח חירום.";
            } else {
                document.getElementById('statusMessage').innerText = "מאתר מיקום... מיד יופיע כפתור השליחה.";
            }
        }

        async function startApp() {
            const video = document.getElementById('video');
            const m = document.getElementById('statusMessage');

            try {
                m.innerText = "מפעיל מצלמה...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;

                // טעינת מודלים של זיהוי פנים
                m.innerText = "טוען מודלים של זיהוי פנים...";
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');
                
                m.innerText = "סורק פנים...";

                // זיהוי פנים לדוגמה (כאן אפשר להוסיף זיהוי אוטומטי או להמתין לקוד סודי)
                // לצורך הדוגמה נניח שזיהוי פנים מוצלח מפעיל גם הוא את ה-unlockApp
                setTimeout(() => {
                    // לדוגמה: אם זיהוי הפנים עבר בהצלחה אוטומטית אחרי 3 שניות:
                    // unlockApp();
                }, 3000);

                // בדיקת מיקום גיאוגרפי
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            const lat = pos.coords.latitude;
                            const lon = pos.coords.longitude;
                            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                            const text = encodeURIComponent(`🚨 SOS! אני זקוק עזרה דחופה! המיקום שלי: ${mapUrl}`);
                            
                            globalLocationUrl = `https://wa.me/${targetPhone}?text=${text}`;
                            m.innerText = "המיקום נמצא. יש להזין קוד סודי לאימות.";
                        },
                        error => {
                            m.innerText = "הרשאת מיקום סגורה בדפדפן";
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }

            } catch (err) {
                console.error(err);
                m.innerText = "שגיאה בגישה למצלמה או למערכת.";
            }
        }

        window.onload = startApp;
    </script>
</body>
</html>
