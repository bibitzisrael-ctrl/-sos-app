<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מוקד חירום - SOS</title>
    <!-- טעינת ספריית זיהוי הפנים -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff0f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }
        .settings-icon {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
        }
        h2 {
            color: #d9534f;
            margin-bottom: 10px;
        }
        #videoContainer {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #statusMessage {
            margin-top: 15px;
            font-size: 16px;
            color: #333;
            font-weight: bold;
        }
        .whatsapp-btn {
            display: none; /* מוסתר בהחלט עד לאיتمام זיהוי מלא ואמיתי */
            margin-top: 15px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- כפתור הגדרות -->
        <button class="settings-icon" onclick="openSettings()">⚙️</button>

        <h2>מוקד חירום</h2>
        <p>אימות נדרש לצורך שליחת מיקום:</p>

        <!-- אזור הזנת קוד סודי וכפתור אישור מתחתיו -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; margin-top: 15px;">
            <input type="password" id="pinInput" placeholder="****" maxlength="4" style="text-align: center; font-size: 20px; padding: 8px; width: 80%; border: 1px solid #ccc; border-radius: 8px;">
            <button id="pinSubmitBtn" onclick="checkPin()" style="background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 80%;">אישור קוד</button>
        </div>

        <!-- מצלמה וזיהוי פנים -->
        <div id="videoContainer">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <div id="statusMessage">ממתין לזיהוי פנים או קוד...</div>
        
        <!-- כפתור שליחת וואטסאפ חירום (מוסתר לחלוטין עד לאימות מאומת) -->
        <a id="waBtn" class="whatsapp-btn" href="#" target="_blank">שלח לאיש קשר SOS</a>
    </div>

    <script>
        const targetPhone = localStorage.getItem('sos_phone') || "972000000000";
        const correctPin = localStorage.getItem('sos_pin') || "1234";
        
        let userLocationUrl = "";
        let isVerified = false; // משתנה שמונע שליחה כל עוד אין אימות

        function openSettings() {
            const pin = prompt("הכנס קוד סודי לכניסה להגדרות:");
            if (pin === correctPin) {
                const newPhone = prompt("הכנס מספר טלפון חדש לוואטסאפ (לדוגמה 9725...):", targetPhone);
                if (newPhone) {
                    localStorage.setItem('sos_phone', newPhone);
                    alert("המספר עודכן בהצלחה!");
                    location.reload();
                }
            } else if (pin !== null) {
                alert("קוד שגוי!");
            }
        }

        // אימות קוד סודי ידני
        function checkPin() {
            const enteredPin = document.getElementById('pinInput').value;
            if (enteredPin === correctPin) {
                grantAccess("אימות קוד סודי עבר בהצלחה!");
            } else {
                alert("קוד סודי שגוי.");
            }
        }

        // פונקציה שחרור נעילה – נפתחת אך ורק אם עבר זיהוי פנים או קוד נכון
        function grantAccess(reason) {
            isVerified = true;
            const m = document.getElementById('statusMessage');
            const waBtn = document.getElementById('waBtn');

            m.style.color = "#28a745";
            m.innerText = reason;

            if (userLocationUrl) {
                waBtn.href = userLocationUrl;
                waBtn.style.display = "block"; // חושף את הכפתור רק עכשיו!
            } else {
                m.innerText += " (מאותר מיקום...)";
            }
        }

        async function startApp() {
            const video = document.getElementById('video');
            const m = document.getElementById('statusMessage');

            try {
                m.innerText = "מפעיל מצלמה...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;

                // טעינת מודלים של זיהוי פנים
                m.innerText = "טוען מערכת זיהוי פנים...";
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');
                
                m.innerText = "סורק פנים לאיتمام זיהוי...";

                // הפעלת לולאת זיהוי פנים אמיתית דרך המצלמה
                setInterval(async () => {
                    if (isVerified) return; // אם כבר אושר, אין צורך להמשיך לסרוק

                    const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
                    
                    if (detections && !isVerified) {
                        // נמצא פנים מול המצלמה באופן אמיתי! מעניקים גישה אוטומטית
                        grantAccess("זוהה פנים בהצלחה! גישה אושרה.");
                    }
                }, 1500);

                // איתור מיקום ברקע (אבל שומרים אותו אצלו, לא משחררים לשליחה עד ש-isVerified יהיה true)
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            const lat = pos.coords.latitude;
                            const lon = pos.coords.longitude;
                            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                            const text = encodeURIComponent(`🚨 SOS! אני זקוק עזרה דחופה! המיקום שלי: ${mapUrl}`);
                            
                            userLocationUrl = `https://wa.me/${targetPhone}?text=${text}`;

                            // אם כבר עבר אימות פנים בינתיים, נפתח מיד את הכפתור
                            if (isVerified) {
                                document.getElementById('waBtn').href = userLocationUrl;
                                document.getElementById('waBtn').style.display = "block";
                            }
                        },
                        error => {
                            m.innerText = "שגיאה: הרשאת מיקום סגורה בדפדפן";
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }

            } catch (err) {
                console.error(err);
                m.innerText = "שגיאה בגישה למצלמה או למערכת.";
            }
        }

        window.onload = startApp;
    </script>
</body>
</html>
