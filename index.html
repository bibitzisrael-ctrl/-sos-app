<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מוקד חירום - SOS</title>
    <!-- טעינת ספריות זיהוי הפנים והתאמתן -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff0f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }
        .settings-icon {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
        }
        h2 {
            color: #d9534f;
            margin-bottom: 10px;
        }
        #videoContainer {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #statusMessage {
            margin-top: 15px;
            font-size: 15px;
            color: #333;
            font-weight: bold;
        }
        .whatsapp-btn {
            display: none; /* מוסתר לחלוטין עד לאימות אמיתי */
            margin-top: 15px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- כפתור הגדרות -->
        <button class="settings-icon" onclick="openSettings()">⚙️</button>

        <h2>מוקד חירום</h2>
        <p id="instructionText">זיהוי פנים או הזנת קוד נדרשים:</p>

        <!-- אזור הזנת קוד סודי וכפתור אישור -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; margin-top: 10px;">
            <input type="password" id="pinInput" placeholder="הכנס קוד סודי" maxlength="6" style="text-align: center; font-size: 18px; padding: 8px; width: 80%; border: 1px solid #ccc; border-radius: 8px;">
            <button id="pinSubmitBtn" onclick="checkPin()" style="background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 80%;">אישור קוד</button>
        </div>

        <!-- מצלמה וזיהוי פנים -->
        <div id="videoContainer">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <div id="statusMessage">טוען מערכת...</div>
        
        <!-- כפתור וואטסאפ מוסתר מראש -->
        <a id="waBtn" class="whatsapp-btn" href="#" target="_blank">שלח לאיש קשר SOS</a>
    </div>

    <script>
        // שליפת נתונים מזיכרון המכשיר או ברירת מחדל
        let targetPhone = localStorage.getItem('sos_phone') || "972000000000";
        let correctPin = localStorage.getItem('sos_pin') || "1234";
        
        let userLocationUrl = "";
        let isVerified = false;

        function openSettings() {
            const pin = prompt("הכנס קוד סודי לכניסה להגדרות:");
            if (pin === correctPin) {
                let action选择 = prompt("בחר פעולה להגדרה:\n1 - שינוי מספר טלפון לוואטסאפ\n2 - שינוי קוד סודי\n3 - איפוס/שמירת פנים מחדש", "1");
                
                if (action选择 === "1") {
                    const newPhone = prompt("הכנס מספר טלפון חדש (לדוגמה 9725...):", targetPhone);
                    if (newPhone) {
                        localStorage.setItem('sos_phone', newPhone);
                        targetPhone = newPhone;
                        alert("מספר הטלפון עודכן בהצלחה!");
                        location.reload();
                    }
                } else if (action选择 === "2") {
                    const newPin = prompt("הכנס קוד סודי חדש:");
                    if (newPin) {
                        localStorage.setItem('sos_pin', newPin);
                        correctPin = newPin;
                        alert("הקוד הסודי עודכן בהצלחה!");
                    }
                } else if (action选择 === "3") {
                    localStorage.removeItem('sos_face_descriptor');
                    alert("נתוני הפנים אופסו. בפתיחה הבאה המערכת תלמד את הפנים מחדש.");
                    location.reload();
                }
            } else if (pin !== null) {
                alert("קוד שגוי!");
            }
        }

        function checkPin() {
            const enteredPin = document.getElementById('pinInput').value;
            if (enteredPin === correctPin) {
                grantAccess("אימות קוד סודי הצליח!");
            } else {
                alert("קוד סודי שגוי.");
            }
        }

        function grantAccess(reason) {
            isVerified = true;
            const m = document.getElementById('statusMessage');
            const waBtn = document.getElementById('waBtn');

            m.style.color = "#28a745";
            m.innerText = reason;

            if (userLocationUrl) {
                waBtn.href = userLocationUrl;
                waBtn.style.display = "block"; // חושף את הכפתור רק עכשיו
            } else {
                m.innerText += " (מאותר מיקום...)";
            }
        }

        async function startApp() {
            const video = document.getElementById('video');
            const m = document.getElementById('statusMessage');

            try {
                m.innerText = "מפעיל מצלמה...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;

                // טעינת מודלים של זיהוי פנים ומדידות פנים (Landmarks + Recognition)
                m.innerText = "טוען מודלים לאימות פנים...";
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmarkNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                m.innerText = "ממתין לזיהוי פנים...";

                let savedDescriptor = localStorage.getItem('sos_face_descriptor');
                let parsedSavedDescriptor = savedDescriptor ? new Float32Array(JSON.parse(savedDescriptor)) : null;

                // לולאת זיהוי פנים
                const interval = setInterval(async () => {
                    if (isVerified) {
                        clearInterval(interval);
                        return;
                    }

                    // זיהוי הפנים הנוכחיות במצלמה כולל מאפיינים ייחודיים
                    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

                    if (detection) {
                        if (!parsedSavedDescriptor) {
                            // פעם ראשונה: שומרים אוטומטית את הפנים שלך בזיכרון המקומי
                            const descriptorArray = Array.from(detection.descriptor);
                            localStorage.setItem('sos_face_descriptor', JSON.stringify(descriptorArray));
                            parsedSavedDescriptor = detection.descriptor;
                            grantAccess("הפנים נשמרו בהצלחה! גישה אושרה.");
                            clearInterval(interval);
                        } else {
                            // בפעמים הבאות: השוואה בין הפנים במצלמה לפנים השמורות (דיוק של פחות מ-0.5 אחוז סטייה)
                            const distance = faceapi.euclideanDistance(detection.descriptor, parsedSavedDescriptor);
                            if (distance < 0.45) {
                                grantAccess("הפנים זוהו בהצלחה! גישה אושרה.");
                                clearInterval(interval);
                            } else {
                                m.innerText = "פנים לא מזוהות. נסה שוב או הזן קוד סודי.";
                            }
                        }
                    }
                }, 1500);

                // איתור מיקום גיאוגרפי ברקע
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            const lat = pos.coords.latitude;
                            const lon = pos.coords.longitude;
                            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                            const text = encodeURIComponent(`🚨 SOS! אני זקוק עזרה דחופה! המיקום שלי: ${mapUrl}`);
                            
                            userLocationUrl = `https://wa.me/${targetPhone}?text=${text}`;

                            if (isVerified) {
                                document.getElementById('waBtn').href = userLocationUrl;
                                document.getElementById('waBtn').style.display = "block";
                            }
                        },
                        error => {
                            m.innerText = "שגיאה: הרשאת מיקום סגורה בדפדפן";
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }

            } catch (err) {
                console.error(err);
                m.innerText = "שגיאה בגישה למצלמה או למערכת.";
            }
        }

        window.onload = startApp;
    </script>
</body>
</html>
